# SunPlayer 配置

# 全服最多允许多少个假人
max-fake-players: 20

naming:
  # 假人的服务端名字前缀。假人 "Steve" 在服务端实际叫 "Bot_Steve"，
  # 这样它和真实玩家 Steve 是两个完全独立的账号：存档、背包、位置、权限互不影响，
  # 真玩家登录时也不会被假人顶号。
  # 填 "" 可以关掉（回到老行为，会与真实玩家同名冲突，不建议）。
  # 前缀加名字总长不能超过 16，所以前缀越长，能起的名字越短。
  fake-prefix: "Bot_"

# 假人视距（区块）。假人没有真实客户端，不需要看很远。
# 这是最省内存/最省 TPS 的一项：默认服务端视距 10 会让每个假人常驻 21x21 区块，
# 压到 2 就只有 5x5（25 个区块），压到 1 是 3x3（9 个区块）。
# 范围 1-32。假人很多、或者机器比较弱时，改成 1 能明显减轻负担。
view-distance: 2

# 生成假人前预加载多少区块（半径）。-1 = 跟随 view-distance。
# 创建假人时最怕的是落点区块还没生成：那样服务端必须在主线程/区域线程上现生成
# 一大片区块，全服会卡一下（实测冷位置一次 ~150ms，机器慢时更久，玩家延迟会瞬间飙高）。
# 现在会先在后台把这片区块加载好，再让假人上线，卡顿就没了。
# 范围 0-4，0 = 关闭预加载。
spawn-preload-radius: -1

# 假人挂机自动删除。
# 假人在线超过下面设置的时间后会被自动 kill（彻底删除，重启也不会复原）。
# 每个假人独立计时；重启后接着原来的剩余时间算（停机期间也在走）。
# 只对普通假人生效：--npcmode 生成的 NPC 是 Mannequin 装饰实体，永久保留。
auto-remove:
  # 挂机上限，单位分钟。0 = 关闭（默认）。
  # 例：120 表示假人最多在线 2 小时。
  minutes: 0
  # 删除前多少分钟提醒假人的主人（主人必须在线，否则只写一行控制台日志）。
  # 0 = 不提醒。提醒里带一条可点击的续时命令 /sunplayer <名字> renew。
  warn-minutes: 1

# 第三方插件兼容。假人没有真实客户端，有些插件会因为拿不到网络连接
# 或者为了强制登录而把假人踢掉 / 传送走，下面几项就是兜底处理。
compat:
  # 拦截插件对假人的踢出（例如 PacketEvents 注入失败时的踢出）。
  # 管理员 /kick、封禁、重启、同名顶号仍然生效。
  prevent-plugin-kicks: true
  # 拦截"白名单"原因（PlayerKickEvent.Cause.WHITELIST）的踢出。
  # 假人根本不走登录流程，不可能出现在任何白名单里，所以针对假人的白名单踢出一定是误伤：
  # 有些白名单插件会在 /deop、/whitelist reload 或定时任务里扫一遍在线玩家再踢。
  # 管理员手动 /kick、封禁不受影响（原因不是 WHITELIST）。
  ignore-whitelist-kick: true
  # 登录前照常派发 AsyncPlayerPreLoginEvent，让 LuckPerms 等插件加载数据。
  # 关掉会让依赖该事件的插件（LuckTags 等）报 NPE。
  fire-pre-login: true
  # 装了 AuthMe 时自动让假人免登录（已注册则 forceLogin，否则 forceRegister）。
  authme-force-login: true
  # 生成后若被 Multiverse 之类的插件传送走，自动拉回生成点。
  restore-position: true
  # 假人死亡后直接按 kill 处理：实体消失、存档删除、不再复活。
  # 关掉则回到原版行为（躺 20 秒后自己站起来）。死亡消息仍然照常广播。
  remove-on-death: true

# /pvpbot 机器人的行为。
pvp:
  # 主人退出游戏时，他的 PVP 机器人一起退出。
  # 按 /pvpbot kill 处理：实体、存档、编号一起清掉，不会被"自动复活"，
  # 服务器重启后也不会再出现。主人下次进来重新 /pvpbot 即可（编号从 1 开始）。
  # 关掉则机器人留在原地等主人回来。
  quit-with-owner: true

# 假人被踢后的自动复活。
# 有些插件直接断开连接、不派发可拦截的事件（或把 compat.prevent-plugin-kicks 关掉了），
# 假人就会被踢下线。开启这项后，只要存档里还有它，它会在几秒后自己回到原来的位置。
# 管理员 /kick、封禁、重启、同名顶号、/sunplayer <名字> kill 都不会触发复活。
auto-revive:
  enabled: true
  # 第一次尝试的延迟（秒），之后每次翻倍（5 → 10 → 20 …），单次最长 60 秒。
  delay-seconds: 5
  # 10 分钟内最多尝试几次，超过就放弃并写一行警告，避免和踢人的插件互相拉锯。
  max-attempts: 6

# 调试：把第三方插件发给假人的聊天消息打印到控制台。
# 排查"假人被某个插件拦住 / 一直提示"时打开。
debug: false
